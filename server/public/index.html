<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DocFlow Admin</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border-bottom: 1px solid #ddd; padding: 0.5rem; text-align: left; }
      button { margin-right: 0.4rem; }
      progress { width: 100%; height: 1.2rem; }
      .error { color: #b00020; }
      .new-key { background: #fff8d6; border: 1px solid #e0c200; padding: 0.75rem; margin: 1rem 0; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- No build step: React comes from a CDN and Babel converts the JSX in the browser. Fine for an internal demo. -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
    <script type="text/babel" src="/app.jsx"></script>
  </body>
</html>
